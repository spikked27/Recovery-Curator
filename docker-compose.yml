services:
  recovery-curator:
    build: .
    image: recovery-curator:local
    container_name: recovery-curator
    ports:
      - "8188:8188"
    environment:
      PUID: "99"
      PGID: "100"
      UMASK: "002"
      ALLOW_ACTIONS: "false"
      ANALYSIS_WORKERS: "1"
      HASH_WORKERS: "1"
      OUTPUT_UID: "99"
      OUTPUT_GID: "100"
      SCAN_BATCH_SIZE: "64"
      SIMILARITY_DISTANCE: "6"
      REFERENCE_ROOT: "/known-good"
      RECOVERY_DATA_ROOT: "/recovery-data"
      SOURCE_SUBPATH: "Recovered"
      OUTPUT_SUBPATH: "Recovered_Curated"
      QUARANTINE_SUBPATH: "Recovered_Quarantine"
      REFERENCE_SUBPATH: "Known-Good"
      RECOVERY_AI_API_KEY: ""
    volumes:
      # Mount the common parent once. Separate /source and /output bind mounts
      # prevent hardlinks inside Docker even when the host paths share a device.
      - /mnt/user/Recovery:/recovery-data:rw
      - /mnt/user/appdata/recovery-curator:/config:rw
    mem_limit: 4g
    restart: unless-stopped
