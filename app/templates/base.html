<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Recovery Curator{% endblock %}</title>
  <style>
    :root { color-scheme: dark; --bg:#101418; --panel:#182028; --muted:#94a3b8; --line:#2b3947; --accent:#4ade80; --warn:#fbbf24; --bad:#fb7185; }
    * { box-sizing:border-box } body { margin:0; font:15px/1.45 system-ui,sans-serif; background:var(--bg); color:#e5edf5 }
    header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:24px; align-items:center; flex-wrap:wrap }
    header h1 { font-size:20px; margin:0 } nav a { color:#b9c8d8; margin-right:18px; text-decoration:none } nav a:hover { color:white }
    main { max-width:1500px; margin:auto; padding:24px } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px }
    .card,.group { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px } .metric { font-size:28px; font-weight:700 }
    .muted { color:var(--muted) } .good { color:var(--accent) } .warn { color:var(--warn) } .bad { color:var(--bad) }
    button,.button { background:#2563eb; color:white; border:0; border-radius:8px; padding:9px 13px; cursor:pointer; text-decoration:none; display:inline-block }
    button.secondary,.button.secondary { background:#334155 } button.danger { background:#be123c }
    button:disabled { opacity:.45; cursor:not-allowed } form { display:inline }
    .scan-actions { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px }
    table { width:100%; border-collapse:collapse; margin-top:16px } th,td { text-align:left; border-bottom:1px solid var(--line); padding:9px; vertical-align:top }
    th { color:#a8bbce; position:sticky; top:0; background:var(--panel) } .path { overflow-wrap:anywhere; max-width:580px }
    .thumb { width:180px; height:140px; object-fit:contain; background:#0b0e11; border-radius:8px }
    .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin-top:12px }
    .item { padding:12px; background:#111820; border:1px solid var(--line); border-radius:10px } .recommended { border-color:var(--accent) }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#2b3947; font-size:12px; margin:2px }
    progress { width:100%; height:16px } .notice { border-left:4px solid var(--warn); padding:12px 16px; background:#2a2415; margin:14px 0 }
  </style>
</head>
<body>
<header><h1>Recovery Curator</h1><nav><a href="/">Dashboard</a><a href="/groups/exact">Exact duplicates</a><a href="/groups/similar">Similar photos</a><a href="/files">Catalog</a></nav></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
